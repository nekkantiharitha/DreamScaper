<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamScaper</title>
    <style>
        /* CSS Reset & Variable Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
        }

        body {
            background: #0d0d13;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Ambient Background */
        .app-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.65) saturate(0.9);
            z-index: -1;
            transition: background-image 0.5s ease-in-out;
        }

        /* Screen Wrapper */
        .container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(13, 13, 19, 0.45);
            backdrop-filter: blur(8px);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Screen Views */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 24px;
            overflow-y: auto;
            position: relative;
        }

        .screen.active {
            display: flex;
        }

        /* Custom Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-btn span {
            display: block;
            width: 24px;
            height: 2px;
            background: #ffffff;
            transition: 0.3s;
        }

        .header-back-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 50%;
            transition: background 0.2s ease;
        }

        .header-back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .profile-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            overflow: hidden;
            cursor: pointer;
        }

        /* Buttons */
        .glow-btn {
            width: 100%;
            max-width: 320px;
            padding: 14px 28px;
            margin: 12px auto;
            border-radius: 50px;
            border: none;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            color: #ffffff;
            background: transparent;
            transition: all 0.3s ease;
            outline: none;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        .btn-green {
            border: 2px solid #a8e6cf;
            box-shadow: 0 0 10px rgba(168, 230, 207, 0.2), inset 0 0 10px rgba(168, 230, 207, 0.1);
        }
        .btn-green:hover {
            box-shadow: 0 0 20px rgba(168, 230, 207, 0.6), inset 0 0 15px rgba(168, 230, 207, 0.3);
            background: rgba(168, 230, 207, 0.05);
        }

        .btn-blue {
            border: 2px solid #a8ddfd;
            box-shadow: 0 0 10px rgba(168, 221, 253, 0.2), inset 0 0 10px rgba(168, 221, 253, 0.1);
        }
        .btn-blue:hover {
            box-shadow: 0 0 20px rgba(168, 221, 253, 0.6), inset 0 0 15px rgba(168, 221, 253, 0.3);
            background: rgba(168, 221, 253, 0.05);
        }

        .btn-yellow {
            border: 2px solid #ffeda6;
            box-shadow: 0 0 10px rgba(255, 237, 166, 0.2), inset 0 0 10px rgba(255, 237, 166, 0.1);
        }
        .btn-yellow:hover {
            box-shadow: 0 0 20px rgba(255, 237, 166, 0.6), inset 0 0 15px rgba(255, 237, 166, 0.3);
            background: rgba(255, 237, 166, 0.05);
        }

        .centered-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            margin-top: 60px;
        }

        h1.welcome-title {
            font-size: 28px;
            margin-bottom: 40px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255,255,255,0.2);
        }

        /* Sidebar */
        .sidebar {
            position: absolute;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: rgba(13, 13, 19, 0.95);
            backdrop-filter: blur(15px);
            z-index: 100;
            transition: left 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 80px 24px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 16px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 18px;
            cursor: pointer;
            padding: 12px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .sidebar-icon {
            font-size: 22px;
            width: 30px;
            text-align: center;
        }

        /* Forms & Inputs */
        .input-group {
            width: 100%;
            max-width: 320px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        .mic-hold-btn {
            width: 100%;
            max-width: 100%;
            min-height: 44px;
            margin: 4px 0 12px 0;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .date-input-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .dropdown-select {
            background: #14141d;
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            font-size: 15px;
            outline: none;
        }

        .mood-chips-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .mood-chip {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }

        .mood-chip.active {
            background: rgba(168, 230, 207, 0.2);
            border-color: #a8e6cf;
            color: #a8e6cf;
        }

        .entry-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 80px;
            width: 100%;
        }

        .entry-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .entry-title {
            font-size: 18px;
            font-weight: bold;
        }

        .entry-date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 80px;
        }

        .gallery-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .gallery-img-container {
            width: 100%;
            aspect-ratio: 3/4;
            background: rgba(0,0,0,0.2);
            position: relative;
        }

        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-info {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .floating-add-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #a8ddfd;
            border: none;
            color: #0d0d13;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(168, 221, 253, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 29, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            z-index: 200;
            transition: bottom 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            pointer-events: none;
        }

        .image-generator-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 80px;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="app-bg" id="bgLayer"></div>

    <div class="container">

        <header id="globalHeader" style="display: none;">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <button class="header-back-btn" onclick="goBack()" title="Go Back">←</button>
            </div>
            <div class="profile-btn" id="profileBadge" onclick="signOutUser()">U</div>
        </header>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-item" onclick="navigateTo('screenMyJournal')">
                <span class="sidebar-icon">📄</span> My Journal
            </div>
            <div class="sidebar-item" onclick="navigateTo('screenAddDream')">
                <span class="sidebar-icon">☁️</span> Add Dream
            </div>
            <div class="sidebar-item" onclick="navigateTo('screenGallery')">
                <span class="sidebar-icon">🖼️</span> Dream Gallery
            </div>
            <div class="sidebar-item" onclick="signOutUser()">
                <span class="sidebar-icon">🚪</span> Sign Out
            </div>
        </div>

        <div class="screen active" id="screenLogin">
            <div class="centered-content">
                <h1 style="font-size: 32px; margin-bottom: 30px;">DreamScaper</h1>
                <div class="input-group">
                    <label>Email Address:</label>
                    <input type="email" id="loginEmail" class="input-field" placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Password:</label>
                    <input type="password" id="loginPassword" class="input-field" placeholder="••••••••">
                </div>
                <button class="glow-btn btn-blue" onclick="handleAuth('login')">Sign In</button>
                <button class="glow-btn btn-green" onclick="handleAuth('signup')">Create New Account</button>
            </div>
        </div>

        <div class="screen" id="screenUsername">
            <div class="centered-content">
                <h1 style="font-size: 28px; margin-bottom: 30px;">What is your name?</h1>
                <div class="input-group">
                    <input type="text" id="userNameInput" class="input-field" placeholder="Enter your username">
                </div>
                <button class="glow-btn btn-yellow" onclick="saveUsernameProfile()">Save & Get Started</button>
            </div>
        </div>

        <div class="screen" id="screenHome">
            <div class="centered-content">
                <h1 class="welcome-title" id="welcomeMsg">Welcome to DreamScaper</h1>
                <button class="glow-btn btn-green" onclick="navigateTo('screenAddDream')">+ Create a New Dream</button>
                <button class="glow-btn btn-blue" onclick="navigateTo('screenJournalCreate')">+ Add Page to Journal</button>
                <button class="glow-btn btn-yellow" onclick="navigateTo('screenGallery')">Go to Dream Gallery</button>
            </div>
        </div>

        <div class="screen" id="screenAddDream">
            <div class="image-generator-container">
                <h2 style="font-size: 24px; margin-bottom: 10px;">Paint a New Dream</h2>
                
                <div class="input-group" style="max-width: 100%;">
                    <label>Dream Title:</label>
                    <input type="text" id="dreamTitle" class="input-field" placeholder="Title of your dream">
                </div>

                <div class="input-group" style="max-width: 100%;">
                    <label>Keywords:</label>
                    <input type="text" id="dreamKeywords" class="input-field" placeholder="Describe key visual elements">
                </div>

                <div class="input-group" style="max-width: 100%;">
                    <label>Atmosphere / Mood:</label>
                    <div class="mood-chips-container" id="moodSelector">
                        <span class="mood-chip active" onclick="selectMood(this, 'Serene & Ethereal')">🌸 Serene</span>
                        <span class="mood-chip" onclick="selectMood(this, 'Mystical & Cosmic')">✨ Mystical</span>
                        <span class="mood-chip" onclick="selectMood(this, 'Vibrant & Surreal')">🌈 Surreal</span>
                    </div>
                </div>

                <button class="glow-btn btn-green" id="btnPaintDream" onclick="generateDreamscape()">Paint & Save Cloud</button>
            </div>
        </div>

        <div class="screen" id="screenGallery">
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>

        <div class="screen" id="screenJournalCreate">
            <div class="image-generator-container">
                <h2 style="font-size: 24px;">Personal Journal Entry</h2>
                
                <div class="input-group" style="max-width: 100%;">
                    <label>Page Title:</label>
                    <input type="text" id="journalTitle" class="input-field" placeholder="Write a page title...">
                </div>

                <div class="input-group" style="max-width: 100%;">
                    <label>Journal entry text:</label>
                    <textarea id="journalContent" class="input-field" style="height: 180px; resize: none;" placeholder="Start writing your thoughts..."></textarea>
                </div>

                <button class="glow-btn btn-blue" onclick="saveJournalPage()">Save Entry</button>
            </div>
        </div>

        <div class="screen" id="screenMyJournal">
            <div class="entry-list" id="journalList"></div>
            <button class="floating-add-btn" onclick="navigateTo('screenJournalCreate')">+</button>
        </div>

    </div>

    <div class="toast" id="toast">Notification text</div>

    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        // REPLACE THE VALUES BELOW WITH YOUR FREE FIREBASE PROJECT KEYS FROM https://console.firebase.google.com/
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // App States
        let currentUser = null;
        let userProfileData = { username: "" };
        let journalData = [];
        let galleryData = [];
        let screenHistory = [];
        let currentScreen = 'screenLogin';
        let selectedDreamMood = "Serene & Ethereal";

        // --- 2. AUTHENTICATION & CROSS-DEVICE SYNC ---
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                // Fetch User Profile Data from Cloud Firestore
                const userDoc = await db.collection("users").doc(user.uid).get();
                if (userDoc.exists) {
                    userProfileData = userDoc.data();
                    document.getElementById('profileBadge').textContent = (userProfileData.username || "U").charAt(0).toUpperCase();
                    document.getElementById('welcomeMsg').textContent = `Welcome, ${userProfileData.username || 'Dreamer'}`;
                    
                    // Fetch Cloud Data
                    await loadCloudData();
                    navigateTo('screenHome');
                } else {
                    navigateTo('screenUsername');
                }
            } else {
                currentUser = null;
                navigateTo('screenLogin');
            }
        });

        async function handleAuth(type) {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) return showToast("Please fill in both Email and Password.");

            try {
                if (type === 'signup') {
                    await auth.createUserWithEmailAndPassword(email, password);
                    showToast("Account created successfully!");
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                    showToast("Logged in!");
                }
            } catch (err) {
                showToast(err.message);
            }
        }

        async function saveUsernameProfile() {
            const name = document.getElementById('userNameInput').value;
            if (!name) return showToast("Please enter a username.");

            if (currentUser) {
                await db.collection("users").doc(currentUser.uid).set({
                    username: name,
                    email: currentUser.email
                });
                userProfileData.username = name;
                document.getElementById('profileBadge').textContent = name.charAt(0).toUpperCase();
                document.getElementById('welcomeMsg').textContent = `Welcome, ${name}`;
                navigateTo('screenHome');
            }
        }

        function signOutUser() {
            auth.signOut();
            showToast("Signed out.");
        }

        // --- 3. CLOUD DATA LOAD & SAVE (Firestore Sync) ---
        async function loadCloudData() {
            if (!currentUser) return;

            // Load Journal Entries from Cloud
            const journalSnapshot = await db.collection("users").doc(currentUser.uid).collection("journals").orderBy("createdAt", "desc").get();
            journalData = journalSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

            // Load Dream Gallery from Cloud
            const gallerySnapshot = await db.collection("users").doc(currentUser.uid).collection("gallery").orderBy("createdAt", "desc").get();
            galleryData = gallerySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        }

        async function saveJournalPage() {
            const title = document.getElementById('journalTitle').value;
            const content = document.getElementById('journalContent').value;

            if (!title || !content) return showToast("Please fill in all fields!");

            const newEntry = {
                title: title,
                content: content,
                date: new Date().toLocaleDateString(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            await db.collection("users").doc(currentUser.uid).collection("journals").add(newEntry);
            showToast("Entry saved to Cloud!");
            document.getElementById('journalTitle').value = '';
            document.getElementById('journalContent').value = '';
            
            await loadCloudData();
            navigateTo('screenMyJournal');
        }

        async function generateDreamscape() {
            const title = document.getElementById('dreamTitle').value || "Untitled Dream";
            const keywords = document.getElementById('dreamKeywords').value || "Ethereal dreamscape";
            
            const prompt = encodeURIComponent(`${keywords}, ${selectedDreamMood}`);
            const imageUrl = `https://image.pollinations.ai/prompt/${prompt}?width=512&height=512&nologo=true`;

            const newDream = {
                title: title,
                mediaUrl: imageUrl,
                date: new Date().toLocaleDateString(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            await db.collection("users").doc(currentUser.uid).collection("gallery").add(newDream);
            showToast(`Dream "${title}" saved to Cloud!`);

            await loadCloudData();
            navigateTo('screenGallery');
        }

        // --- 4. RENDER UI ---
        function renderJournal() {
            const list = document.getElementById('journalList');
            list.innerHTML = '';

            if (journalData.length === 0) {
                list.innerHTML = '<p style="text-align:center; color: rgba(255,255,255,0.5);">No journal entries found.</p>';
                return;
            }

            journalData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'entry-card';
                card.innerHTML = `
                    <div class="entry-title">${item.title}</div>
                    <div class="entry-date">${item.date}</div>
                    <div style="font-size: 14px; margin-top: 6px; opacity: 0.8;">${item.content}</div>
                `;
                list.appendChild(card);
            });
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            if (galleryData.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: rgba(255,255,255,0.5);">No dreams generated yet.</p>';
                return;
            }

            galleryData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'gallery-card';
                card.innerHTML = `
                    <div class="gallery-img-container">
                        <img src="${item.mediaUrl}" class="gallery-img" />
                    </div>
                    <div class="gallery-info">
                        <span style="font-weight: bold; font-size: 14px;">${item.title}</span>
                        <span style="font-size: 11px; color: rgba(255,255,255,0.5);">${item.date}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- 5. NAVIGATION SYSTEM ---
        function navigateTo(screenId) {
            if (currentScreen && currentScreen !== screenId) {
                screenHistory.push(currentScreen);
            }
            showScreen(screenId);
        }

        function goBack() {
            if (screenHistory.length > 0) {
                const previousScreen = screenHistory.pop();
                showScreen(previousScreen);
            } else {
                navigateTo('screenHome');
            }
        }

        function showScreen(screenId) {
            currentScreen = screenId;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            const noHeaderScreens = ['screenLogin', 'screenUsername'];
            if (noHeaderScreens.includes(screenId)) {
                document.getElementById('globalHeader').style.display = 'none';
            } else {
                document.getElementById('globalHeader').style.display = 'flex';
            }

            document.getElementById('sidebar').classList.remove('open');

            if (screenId === 'screenMyJournal') renderJournal();
            if (screenId === 'screenGallery') renderGallery();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.bottom = '30px';
            setTimeout(() => {
                toast.style.bottom = '-60px';
            }, 3000);
        }

        function selectMood(element, moodText) {
            document.querySelectorAll('.mood-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            selectedDreamMood = moodText;
        }
    </script>
</body>
</html>
